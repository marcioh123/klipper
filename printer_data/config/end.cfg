[gcode_macro PRINT_END]
gcode:
    M104 S0 ; Desliga o bico
    M140 S0 ; Desliga a mesa
    M106 S0 ; Desliga a ventoinha (garante que ela desliga aqui)
    G91 ; Relativo
    G1 Z10 F3000 ; Sobe +10mm para afastar da peça
    G1 E-10 F2400  ;Retract filament
    G90 ; Absoluto
    G1 X0 Y220 F6000 ; Move o eixo X para o zero e joga a mesa para frente
    M84 ; Desliga os motores
    SET_LED LED=extruder RED=0.078 GREEN=0.568 BLUE=1