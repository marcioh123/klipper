[gcode_macro PRINT_END]
gcode:
  M400                          ; Garante que o desenho da peça acabou 100%
  G91                           ; Muda para posicionamento relativo
  G1 E-4 Z3 F3600               ; RETRAÇÃO AGRESSIVA: Puxa 4mm e sobe 3mm na diagonal super rápido
  G0 Z7 F3000                   ; Sobe mais 7mm (completando os 10mm de subida total)
  
  G90                           ; Muda para posicionamento absoluto
  G0 X0 Y300 F7500              ; Joga a mesa para frente rápido
  
  TURN_OFF_HEATERS              ; Desliga os aquecedores
  M84                           ; Desliga os motores
  M106 S0                       ; Desliga a ventoinha
  SET_LED LED=extruder RED=0.078 GREEN=0.568 BLUE=1
