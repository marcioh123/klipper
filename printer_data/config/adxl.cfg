[mcu adxl]
serial: /dev/serial/by-id/usb-Klipper_rp2040_MELLOW-if00

[adxl345]
cs_pin: adxl:gpio9
spi_software_sclk_pin: adxl:gpio10
spi_software_mosi_pin: adxl:gpio11
spi_software_miso_pin: adxl:gpio12
# Se o seu modelo for o Fly-LIS2DW substitua "[adxl345]" por "[lis2dw]"

[resonance_tester]
accel_chip: adxl345 # mude para lis2dw se aplicável
probe_points: 150, 150, 10  # Ajuste para o centro da sua mesa