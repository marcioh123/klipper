[gcode_macro PRINT_START]
gcode:
  G90  ;Set to absolute positioning
  SET_LED_TO_WHITE ; Set print head LED to white

  ; --- AQUECIMENTO ANTES DO HOMING ---
  ; 1. Lê os parâmetros enviados pelo OrcaSlicer
  {% set bed_temp = params.BED|default(60)|float %}
  {% set extruder_temp = params.EXTRUDER|default(200)|float %}

  ; 2. Inicia aquecimento (sem bloquear)
  M140 S{bed_temp}
  M104 S{extruder_temp}

  ; 3. Espera a mesa (a mesa demora mais, então espera ela primeiro)
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp - 2} MAXIMUM={bed_temp + 5}

  ; 4. Homing com a mesa já quente
  SMARTHOME

  ; 5. Espera o bico atingir a temperatura
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder_temp - 3} MAXIMUM={extruder_temp + 3}

  ; 6. Carrega o bed mesh
  BED_MESH_PROFILE LOAD=default  ;Load Bed Mesh Profile ### (COMMENT OUT IF USING KAMP)

  ; 7. Purga
  _PURGE_LINE  ;Side Purge ################################ (COMMENT OUT IF USING KAMP)
  #KAMP ; use KAMP ######################################## (UNCOMMENT TO USE KAMP)

[gcode_macro _PURGE_LINE]
gcode:
  {% if printer["gcode_macro status_cleaning"] != null %}
    status_cleaning
  {% endif %}
  SAVE_GCODE_STATE NAME=Pre_Prime
  SET_LED LED=extruder RED=1 GREEN=1 BLUE=1
        
  G92 E0 ; reset extruder
  G1 Z1.0 F3000 ; move z up little to prevent scratching of surface
  G1 X2 Y25 Z0.3 F5000.0 ; move to start-line position
  G1 X2 Y275.0 Z0.3 F1500.0 E40 ; draw 1st line
  G1 X2.5 Y275.0 Z0.3 F5000.0 ; move to side a little
  G92 E0 ; reset extruder
  G1 X2.5 Y25 Z0.3 F1500.0 E40 ; draw 2nd line
  G92 E0 ; reset extruder
  #G1 E-3 F2400 ; retract
  #G92 E0 ; reset extruder
  G1 Z1.0 F3000 ; move z up little to prevent scratching of surface
  RESTORE_GCODE_STATE NAME=Pre_Prime

  {% if printer["gcode_macro status_printing"] != null %}
    status_printing
  {% endif %}

[gcode_macro SET_LED_TO_WHITE]
gcode:
  SET_LED LED=extruder RED=1 GREEN=1 BLUE=1