[gcode_macro PRINT_START]
gcode:
  G90  ; Garante coordenadas absolutas para os eixos X, Y e Z
  M82  ; Coloca o extrusor em modo Absoluto apenas para a purga funcionar
  SMARTHOME  ; Home em todos os eixos se necessário
  BED_MESH_PROFILE LOAD=default  ; Carrega o perfil da mesa
  SET_LED_TO_WHITE ; Acende o LED do bico
  
  _PURGE_LINE  ; Faz a linha de purga na lateral
  
  # === O SEGREDO DO MODO RELATIVO ESTÁ AQUI ===
  G92 E0  ; Zera completamente o extrusor após a purga
  M83     ; Muda o extrusor DEFINITIVAMENTE para Modo Relativo antes de começar a peça

[gcode_macro _PURGE_LINE]
gcode:
  {% if printer["gcode_macro status_cleaning"] != null %}
    status_cleaning
  {% endif %}
  SAVE_GCODE_STATE NAME=Pre_Prime
  SET_LED LED=extruder RED=1 GREEN=1 BLUE=1
        
  G92 E0 ; Zera o extrusor antes de começar a purgar
  G1 Z1.0 F3000 ; Sobe o Z de leve para não riscar a mesa
  G1 X2 Y25 Z0.3 F5000.0 ; Vai para a posição inicial da purga
  G1 X2 Y275.0 Z0.3 F1500.0 E20 ; Desenha a primeira linha de purga (extrui 20mm)
  G1 X2.5 Y275.0 Z0.3 F5000.0 ; Move um pouquinho para o lado
  G1 X2.5 Y25 Z0.3 F1500.0 E40 ; Desenha a segunda linha (extrui até acumular 40mm)
  
  G92 E0 ; Zera o extrusor novamente
  G1 E-1 F2400 ; Retração rápida de 1mm para não babar plástico no caminho da peça
  G92 E0 ; Zera o extrusor mais uma vez após a retração
  
  G1 Z1.0 F3000 ; Sobe o Z para se deslocar com segurança
  RESTORE_GCODE_STATE NAME=Pre_Prime

  {% if printer["gcode_macro status_printing"] != null %}
    status_printing
  {% endif %}
