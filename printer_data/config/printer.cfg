[exclude_object]

#[include KAMP_Settings.cfg] 
[include mainsail.cfg]
[include start.cfg]
[include end.cfg]
[include macros.cfg]

[pause_resume]
[display_status]

[virtual_sdcard]
path: /home/marcio/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f401xc_3F0068001251383531393138-if00

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 2000
max_z_velocity: 50
max_z_accel: 400
square_corner_velocity: 5.0

[force_move]
enable_force_move: True

[filament_switch_sensor filament]
pause_on_runout: True
runout_gcode: M117 Filament runout
insert_gcode: M117 Filament insert
switch_pin: PA0 

#############################
# INPUT SHAPER
#############################
[input_shaper]

#############################
# MOTION AXES
#############################

[stepper_x]
step_pin: !PB14
dir_pin: PB13
enable_pin: !PB15
microsteps: 16
rotation_distance: 39.94
endstop_pin: !PA2
position_endstop: 0
position_max: 300
homing_speed: 100
second_homing_speed: 125

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB12
microsteps: 16
rotation_distance: 39.94
endstop_pin: !PA1
position_endstop: 0
position_max: 300
homing_speed: 125
second_homing_speed: 10

[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 7.96
# Aponta diretamente para o sensor virtual gerado pelo dockable_probe
endstop_pin: probe:z_virtual_endstop 
position_max: 400
position_min: -5
homing_speed: 10
second_homing_speed: 4

[extruder]
step_pin: PA7
dir_pin: PA6
enable_pin: !PC4
microsteps: 16
rotation_distance: 22
gear_ratio: 66:22
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 1000
max_extrude_cross_section: 5

#############################
# THERMAL SETTINGS
#############################

[extruder]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F 
sensor_pin: PC0
control: pid
pid_kp: 23.509
pid_ki: 1.438
pid_kd: 96.092
min_temp: 0
max_temp: 300

[heater_bed]
heater_pin: PA8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC1
control: pid
pid_kp: 42.365
pid_ki: 0.545
pid_kd: 822.940
min_temp: 0
max_temp: 130

[fan]
pin: PC8
off_below: 0.1

[heater_fan extruder]
pin: PC7
off_below: 0.2

[controller_fan case]
pin: PC6
off_below: 0.3
idle_speed: 0.0

[temperature_sensor mainboard]
sensor_type: temperature_mcu
min_temp: 10
max_temp: 60

#############################
# LEVELING & PROBE
#############################

[probe]
pin: ^!PC2                # Pino onde o sensor está conectado
x_offset: 4               # Distância X do bico ao sensor
y_offset: 21              # Distância Y do bico ao sensor
z_offset: 0               # Ajuste depois com o comando PROBE_CALIBRATE
speed: 5.0
samples: 3
sample_retract_dist: 2
samples_tolerance: 0.00625
samples_tolerance_retries: 6

[safe_z_home]
home_xy_position: 150, 150 # Centro da mesa Artillery X2
z_hop: 15                 # Sobe o eixo Z antes de mover
speed: 100

[bed_mesh]
speed: 150
horizontal_move_z: 10     # Mantém o Z alto para segurança do KlackEnder
mesh_min: 30, 30
mesh_max: 270, 270
probe_count: 5,5
fade_start: 1
fade_end: 10
fade_target: 0
mesh_pps: 2,2
algorithm: bicubic

# Correção do bloco que estava cortado no seu texto
[bed_screws]
screw1: 50,50
screw1_name: front left
screw2: 250,50
screw2_name: front right
screw3: 250,250
screw3_name: back right
screw4: 50,250
screw4_name: back left
