#gcode:
#PROBE_CALIBRATE

#[gcode_macro BED_TRAM]
#gcode:
#SCREWS_TILT_CALCULATE

[gcode_macro G28]    #klicky
rename_existing: G28.1
gcode:
    # Determina quais eixos precisam de Home
    {% set do_x = 'X' in params or not ('X' in params or 'Y' in params or 'Z' in params) %}
    {% set do_y = 'Y' in params or not ('X' in params or 'Y' in params or 'Z' in params) %}
    {% set do_z = 'Z' in params or not ('X' in params or 'Y' in params or 'Z' in params) %}

    # 1. Faz Homing de X e Y se necessário
    {% if do_x or do_y %}
        G28.1 {% if do_x %} X {% endif %} {% if do_y %} Y {% endif %}
    {% endif %}

    # 2. Faz Homing do eixo Z
    {% if do_z %}
        # Move o cabeçote para uma altura segura (ex: Z=20) antes de pedir o probe
        # Nota: Se a impressora não tiver feito home de Z ainda, use FORCE_MOVE se ativo,
        # mas mover X/Y para o centro é mais seguro se já souber a posição.
        G1 Z20 F3000 ALLOW_UNHOMED=1 # Garante que está alto para não bater
        
        MANUAL_ATTACH # Pausa e pede para colocar o probe
        
        # Move para o centro da mesa para fazer o Home do Z (Ajuste para sua mesa)
        G1 X155 Y155 F6000 
        
        G28.1 Z # Faz o Home real do Z
        
        G1 Z30 F3000 # Sobe o cabeçote para dar espaço de tirar
        
        MANUAL_DOCK # Pausa e pede para retirar o probe
    {% endif %}


[gcode_macro MANUAL_ATTACH]  #klicky
gcode:
    {action_respond_info(">>> ENCAIXE O PROBE MANUALMENTE NOS ÍMÃS <<<")}
    M117 Encaixe o Probe Z
    PAUSE

[gcode_macro MANUAL_DOCK]# klicky
gcode:
    {action_respond_info(">>> REMOVA O PROBE MANUALMENTE AGORA <<<")}
    M117 Remova o Probe Z
    PAUSE    

